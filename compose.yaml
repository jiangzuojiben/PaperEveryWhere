name: paperdesk
x-app-env: &app-env
  PAPERDESK_DATABASE_URL: postgresql+psycopg://paperdesk:${POSTGRES_PASSWORD:?Run scripts/setup.py first}@postgres/paperdesk
  PAPERDESK_REDIS_URL: redis://redis:6379/0
  PAPERDESK_ENCRYPTION_KEY: ${PAPERDESK_ENCRYPTION_KEY:?Run scripts/setup.py first}
  PAPERDESK_S3_ENDPOINT: http://storage:9000
  PAPERDESK_S3_BUCKET: paperdesk
  PAPERDESK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-paperdesk}
  PAPERDESK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/setup.py first}
  PAPERDESK_OPENALEX_KEY: ${PAPERDESK_OPENALEX_KEY:-}
  PAPERDESK_CROSSREF_EMAIL: ${PAPERDESK_CROSSREF_EMAIL:-}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperdesk
      POSTGRES_DB: paperdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paperdesk -d paperdesk']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperdesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup.py first}
    volumes: [objects:/data]
    restart: unless-stopped
  bucket:
    image: minio/mc:latest
    depends_on: [storage]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperdesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup.py first}
    entrypoint: [/bin/sh, -c]
    command:
      - 'until mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/paperdesk'
  api:
    command: [uvicorn, backend.main:app, --host, 0.0.0.0, --port, '8765']
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-env
    ports: ['127.0.0.1:8765:8765']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      bucket: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8765/health")']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-env
    command: [celery, -A, backend.tasks.celery, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
  objects:
