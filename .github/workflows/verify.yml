name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - run: flutter pub get
        working-directory: client
      - run: flutter analyze
        working-directory: client
      - run: flutter test
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: client/build/windows/x64/runner/Release/}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - run: flutter build apk --debug
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: {name: android-debug, path: client/build/app/outputs/flutter-apk/app-debug.apk}
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - run: flutter build ios --release --no-codesign
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: {name: ios-unsigned, path: client/build/ios/iphoneos/Runner.app}
