name: paperdesk-online
services:
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [uvicorn, backend.cloud_main:app, --host, 0.0.0.0, --port, '8765', --workers, '1', --no-access-log]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    ports: ['127.0.0.1:8765:8765']
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
